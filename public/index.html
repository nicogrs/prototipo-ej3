<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1324" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Tu copiloto cuando algo se sale del plan: qué pasó, qué sigue y cuánto falta." />
    <title>Copiloto de imprevistos</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div class="relative mx-auto flex h-dvh max-w-md flex-col overflow-hidden bg-noche-900 sm:border-x sm:border-noche-800">

      <main id="vista" class="flex-1 overflow-y-auto overscroll-contain"></main>
      <nav id="tabs" class="shrink-0 border-t border-noche-800 bg-noche-900/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"></nav>
